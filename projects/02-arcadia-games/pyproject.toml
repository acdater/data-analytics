[project]
name = "arcadia-games"
version = "0.1.0"
description = "Reproducible synthetic operational data for Dungeon Rush analytics practice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "faker>=37,<41",
  "numpy>=2.2,<3", "pandas>=2.2,<4", "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1", "scipy>=1.15,<2", "jupyterlab>=4.3,<5",
  "ipykernel>=6.29,<8", "python-dotenv>=1,<2",
]
[dependency-groups]
dev = ["pytest>=8,<10"]
[project.scripts]
arcadia = "arcadia.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/arcadia"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires ARCADIA_TEST_DATABASE=1 and the dedicated Arcadia database"]
