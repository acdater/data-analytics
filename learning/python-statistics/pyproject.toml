[project]
name = "python-statistics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "aceglei", email = "54019771+acdater@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[project.scripts]
python-statistics = "python_statistics:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
